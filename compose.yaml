services:
  fireops-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fireops-api:local
    container_name: fireops-api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - fireassets-net

    mem_limit: 384m
    cpus: 0.75

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  fireassets-net:
    external: true
    name: fireassets-net
