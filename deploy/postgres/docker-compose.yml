services:
  postgres:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-fireassets-postgres}
    restart: unless-stopped
    ports:
      # Confinamiento estricto a loopback del host (accesible por procesos host en 127.0.0.1)
      - "${POSTGRES_BIND_PORT:-127.0.0.1:5432}:5432"
    networks:
      # Red privada tipo bridge para comunicación inter-contenedor (ej. backend FastAPI en Docker)
      - fireassets-net
    environment:
      # Superusuario administrativo separado del usuario de aplicación
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres_admin}
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?Error: POSTGRES_SUPERUSER_PASSWORD is required in .env}"
      POSTGRES_DB: ${POSTGRES_INIT_DB:-postgres}
      # Parámetros para la creación del rol de aplicación en init-db.sh
      FIREOPS_APP_USER: ${FIREOPS_APP_USER:-fireops_app}
      FIREOPS_APP_PASSWORD: "${FIREOPS_APP_PASSWORD:?Error: FIREOPS_APP_PASSWORD is required in .env}"
      FIREOPS_APP_DB: ${FIREOPS_APP_DB:-fireassets}
      # Subdirectorio pgdata dentro del volumen para evitar colisiones con lost+found
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Volumen persistente dedicado
      - fireassets_pgdata:/var/lib/postgresql/data
      # Script de inicialización de roles mínimos (solo en primer arranque)
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    # Parámetros afinados para perfil OLTP acotado en VPS de 2 GB RAM (1.13 GB libres)
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=25
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c wal_buffers=2MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c log_destination=stderr
      -c logging_collector=off
    deploy:
      resources:
        limits:
          cpus: "0.50"
          # Límite ajustado a 384 MB para evitar OOM kills durante picos de restauración y sorts concurrentes
          memory: 384M
        reservations:
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  fireassets-net:
    name: ${POSTGRES_NETWORK_NAME:-fireassets-net}
    driver: bridge

volumes:
  fireassets_pgdata:
    name: ${POSTGRES_VOLUME_NAME:-fireassets_pgdata}
